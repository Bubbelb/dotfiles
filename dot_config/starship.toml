"$schema" = 'https://starship.rs/config-schema.json'

format = """
[$custom.yazi]
[╭─](fg:base1)\
[](sol_orange)\
$os\
[](bg:sol_yellow fg:sol_orange)\
$directory\
[](fg:sol_yellow bg:sol_cyan)\
$git_branch\
$git_status\
[](fg:sol_cyan bg:sol_blue)\
[](fg:base2 bg:base2)\
[ ](fg:base2)\
$fill\
[](sol_orange)\
$username\
[@](bg:sol_orange fg:base3)$hostname\
[](fg:base2 bg:base2)\
$time\
[ ](fg:base2)\
$line_break\
[╰─](fg:base1)\
$character"""

#add_newline = true

palette = 'solarized_light'

[palettes.solarized_light]
# background and content tones:
#                           # DARK MODE             | LIGHT MODE
base03        = '#002b36'   # background            | -
base02        = '#073642'   # background highlights | -
base01        = '#586e75'   # comments              | opt. emph. content
base00        = '#657b83'   # -                     | primary content
base0         = '#839496'   # primary content       | -
base1         = '#93a1a1'   # opt. emph. content    | comments
base2         = '#eee8d5'   # -                     | background highlights
base3         = '#fdf6e3'   # -                     | background
# accent colors:
sol_yellow    = '#b58900'
sol_orange    = '#cb4b16'
sol_red       = '#dc322f'
sol_magenta   = '#d33682'
sol_violet    = '#6c71c4'
sol_blue      = '#268bd2'
sol_cyan      = '#2aa198'
sol_green     = '#859900'
# Note that for tones, the normal relationship for background and body text
# is `base03:base0` for dark mode and `base3:base00` for light mode.
# Notice the "flipping" of leading 0?

[os]
disabled = false
style = "bg:sol_orange fg:base3"
format = '[ $symbol ]($style)'

[os.symbols]
Macos = ""
Ubuntu = "󰕈"
Windows = "󰍲"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
CachyOS = ""

[username]
show_always = true
style_user = "bg:sol_orange fg:base3 bold"
style_root = "bg:sol_red fg:base3 bold"
format = '[ $user]($style)'

[hostname]
ssh_only = false
style = "bg:sol_orange fg:base2 bold"
format = '[$hostname $ssh_symbol ]($style)'

[directory]
style = "bg:sol_yellow fg:base3"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 ~/Documents"
"Downloads" = " ~/Downloads"
"Music" = "󰝚 ~/Music"
"Pictures" = " ~/Pictures"
"Code" = "󰲋 ~/Code"
"Projects" = "󰲋 ~/Projects"
"~" = " ~"

[git_branch]
symbol = ""
style = "bg:sol_cyan"
format = '[[ $symbol $branch ](fg:base3 bg:sol_cyan)]($style)'

[git_status]
style = "bg:sol_cyan"
format = '[[($all_status$ahead_behind )](fg:base3 bg:sol_cyan)]($style)'

[fill]
symbol = ' '

[time]
disabled = false
time_format = "%T"
style = "bg:base3"
format = '[[  $time ](bold fg:base02 bg:base2)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:sol_green)'
error_symbol = '[❯](bold fg:sol_red)'
vimcmd_symbol = '[❮](bold fg:sol_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:sol_violet)'
vimcmd_replace_symbol = '[❮](bold fg:sol_violet)'
vimcmd_visual_symbol = '[❮](bold fg:sol_yellow)'

[custom.yazi]
when = ''' pstree -s $(cat /proc/self/status | sed -n '/^PPid:/ s/^PPid:\s*//p') | sed -n 's/\(-[-+]-\|^\)yazi\(-[-+]-\|$\)/true/p' '''
format = 'YAZI'
